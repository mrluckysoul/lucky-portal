<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Portal · Sign in</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>" />
</head>
<body>
  <main class="center-page">
    <section class="glass auth-card fade-in">
      <div class="brand" style="margin-bottom:18px"><span class="dot"></span> Lucky Portal</div>

      <div id="authPanel">
        <h1>Welcome 👋</h1>
        <p class="lead">Create an account or sign in to unlock your profile, the arcade and more.</p>

        <div class="tabs">
          <button type="button" id="tabSignin" class="active">Sign in</button>
          <button type="button" id="tabSignup">Sign up</button>
        </div>

        <div id="alertBox" class="alert hidden"></div>

        <form id="signinForm">
          <div class="field">
            <label for="signinEmail">Email</label>
            <input id="signinEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="signinPassword">Password</label>
            <input id="signinPassword" type="password" autocomplete="current-password" placeholder="Your password" required />
          </div>
          <button class="btn" type="submit">Sign in</button>
        </form>

        <form id="signupForm" class="hidden">
          <div class="field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="signupPhone">Mobile number (optional, for SMS OTP)</label>
            <input id="signupPhone" type="tel" placeholder="+919876543210" />
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />
          </div>
          <div class="field">
            <label for="signupConfirm">Confirm password</label>
            <input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password" required />
          </div>
          <button class="btn" type="submit">Create account</button>
        </form>

        <div class="divider">or continue with</div>
        <div id="googleMount"></div>
        <button type="button" id="mockGoogle" class="google-btn hidden">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-17z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.6 2.1-8.8 2.1-6.3 0-11.7-3.7-13.6-9.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Continue with Google (demo)
        </button>
      </div>

      <div id="otpPanel" class="hidden">
        <h1>Verify it's you 🔐</h1>
        <p class="lead">We sent a 6 digit code to <b id="otpTarget"></b>. Enter it below.</p>
        <div id="otpAlert" class="alert hidden"></div>
        <div class="otp-inputs" id="otpInputs">
          <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
          <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
          <input inputmode="numeric" maxlength="1" /><input inputmode="numeric" maxlength="1" />
        </div>
        <button class="btn" id="verifyBtn" type="button">Verify and continue</button>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn ghost small" id="resendBtn" type="button">Resend code</button>
          <button class="btn ghost small" id="backBtn" type="button">Back</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
